<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>透明物理幕布 · 手势交互</title>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#000; font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }

  canvas { display:block; position:absolute; top:0; left:0; z-index:1; }

  #cam-video { display:none; }
  #media-img, #media-video { display:none; }

  /* ===== Start Overlay ===== */
  #start-overlay {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.88); z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff;
  }
  #start-overlay.hidden { display:none; }
  #start-overlay h1 {
    font-size:clamp(1.4rem,3vw,2rem); font-weight:300; letter-spacing:0.06em;
    margin-bottom:0.5rem;
  }
  #start-overlay p {
    font-size:0.85rem; color:#888; margin-bottom:2rem; text-align:center;
    max-width:18rem; line-height:1.6;
  }
  #start-btn {
    padding:0.8rem 2.4rem; font-size:1rem; letter-spacing:0.08em;
    border:1px solid rgba(255,255,255,0.35); background:rgba(255,255,255,0.06);
    color:#fff; border-radius:2rem; cursor:pointer;
    transition:background 0.25s, border-color 0.25s;
    touch-action:manipulation;
  }
  #start-btn:hover { background:rgba(255,255,255,0.14); border-color:rgba(255,255,255,0.6); }

  /* ===== UI Controls Layer ===== */
  #ui-layer {
    position:fixed; z-index:50; pointer-events:none;
    top:0; left:0; width:100%; height:100%;
  }
  #ui-layer > * { pointer-events:auto; }

  /* Bottom-right cluster */
  #controls-br {
    position:absolute; bottom:1.2rem; right:1.2rem;
    display:flex; flex-direction:column; gap:0.55rem; align-items:flex-end;
  }
  .ctrl-btn {
    width:2.6rem; height:2.6rem; border-radius:50%;
    border:1px solid rgba(255,255,255,0.3); background:rgba(0,0,0,0.45);
    color:#fff; font-size:1.1rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    transition:background 0.2s, border-color 0.2s;
    touch-action:manipulation;
  }
  .ctrl-btn:hover { background:rgba(255,255,255,0.15); border-color:rgba(255,255,255,0.55); }
  .ctrl-btn.active { background:rgba(255,255,255,0.22); border-color:#fff; }

  #zoom-slider {
    -webkit-appearance:none; width:7rem; height:3px;
    background:rgba(255,255,255,0.35); border-radius:2px; outline:none;
    cursor:pointer;
  }
  #zoom-slider::-webkit-slider-thumb {
    -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
    background:#fff; cursor:pointer; border:none;
  }

  /* Top-right: eye toggle */
  #toggle-ui-btn {
    position:absolute; top:1rem; right:1rem;
    width:2.4rem; height:2.4rem; border-radius:50%;
    border:1px solid rgba(255,255,255,0.25); background:rgba(0,0,0,0.38);
    color:#fff; font-size:1.1rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    transition:background 0.2s;
    touch-action:manipulation;
  }
  #toggle-ui-btn:hover { background:rgba(255,255,255,0.12); }

  .ui-hidden .ctrl-btn,
  .ui-hidden #zoom-slider,
  .ui-hidden #toggle-ui-btn { opacity:0; transition:opacity 0.3s; pointer-events:none; }

  /* Placeholder hint */
  #placeholder-hint {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    color:#555; font-size:0.9rem; text-align:center; pointer-events:none;
  }
  #placeholder-hint.hidden { display:none; }

  /* ===== Hidden file input ===== */
  #file-input { display:none; }
</style>
</head>
<body>

<!-- Start Overlay -->
<div id="start-overlay">
  <h1>透明物理幕布</h1>
  <p>点击「开始」后将请求摄像头权限<br>拖拽幕布查看背后的隐藏画面</p>
  <button id="start-btn">开 始</button>
</div>

<!-- Camera video element (DOM-based, used with getUserMedia) -->
<video id="cam-video" playsinline autoplay muted></video>

<!-- Uploaded media elements -->
<img id="media-img" alt="" />
<video id="media-video" loop playsinline></video>

<!-- Hidden file input -->
<input type="file" id="file-input" accept="image/*,video/*" />

<!-- UI Layer -->
<div id="ui-layer">
  <button id="toggle-ui-btn" title="隐藏/显示 UI">👁</button>

  <div id="controls-br">
    <button id="upload-btn" class="ctrl-btn" title="上传图片/视频">🖼</button>
    <button id="flip-btn" class="ctrl-btn" title="翻转摄像头">🔄</button>
    <input type="range" id="zoom-slider" min="0.5" max="2" step="0.01" value="1" title="缩放" />
  </div>

  <div id="placeholder-hint">点击右下角 <span style="font-size:1.2rem;">🖼</span><br>上传图片或视频</div>
</div>

<!-- ====== MediaPipe Hands CDN ====== -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<!-- ====== p5.js CDN ====== -->
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>

<script>
// ═══════════════════════════════════════════════
//  Phase 3: MediaPipe Hands + Fling/Fall + Soft-Pin
//  Transparent Physical Curtain — Optical Camouflage
// ═══════════════════════════════════════════════

// ─── DOM refs ───
const startOverlay = document.getElementById('start-overlay');
const startBtn     = document.getElementById('start-btn');
const uiLayer      = document.getElementById('ui-layer');
const toggleUiBtn  = document.getElementById('toggle-ui-btn');
const uploadBtn    = document.getElementById('upload-btn');
const flipBtn      = document.getElementById('flip-btn');
const zoomSlider   = document.getElementById('zoom-slider');
const fileInput    = document.getElementById('file-input');
const placeholder  = document.getElementById('placeholder-hint');
const camVideo     = document.getElementById('cam-video');
const mediaImg     = document.getElementById('media-img');
const mediaVideo   = document.getElementById('media-video');

// ─── App state ───
let started      = false;
let uiVisible    = true;
let facingMode   = 'user';
let camReady     = false;
let camAspect    = 4/3;

let uploadedMedia = null;
let mediaType     = null;
let mediaScale    = 1.0;

// ─── Verlet Cloth Physics ───
const COLS  = 38;
const ROWS  = 35;
const FRICTION       = 0.94;
const GRAVITY        = 0.08;
const CONSTRAINT_ITERS = 12;
const STIFFNESS      = 0.4;
const GRAB_RADIUS    = 150;

// Soft pin: top row restoring stiffness (0=free, 1=rigid)
const TOP_ROW_STIFFNESS_X = 0.35;  // lateral restoring
const TOP_ROW_STIFFNESS_Y = 0.18;  // vertical restoring (softer, allows pulling down)

let grid        = [];
let clothInitX  = 0;
let clothInitY  = 0;
let clothW      = 0;
let clothH      = 0;
let spacingX    = 0;
let spacingY    = 0;
let windTime    = 0;
let grabbedRow  = -1;
let grabbedCol  = -1;

// ─── Fling / fall state ───
let flingMode   = null;    // 'up' | 'down' | null
let flingTargetY = 0;      // target Y for fling-up
let flingRestore = 0;      // current restore force multiplier

// ─── Mouse velocity tracking ───
let prevMouseX  = 0;
let prevMouseY  = 0;
let mouseVelX   = 0;
let mouseVelY   = 0;
let lastGrabVY  = 0;       // release velocity for fling detection

// ─── MediaPipe Hands ───
let hands         = null;
let handsLoaded   = false;
let handsActive   = false;
let handsBusy     = false;     // mutex: only one send() in flight
let handsSkip     = 0;         // frame skip counter
const HANDS_FPS   = 4;         // send every N p5 frames (~15fps at 60fps)
let latestResults = null;
let handTrack     = [];        // [{id, x, y, vx, vy, pinching, pinchDist}]
let handGrabs     = [];        // [{handId, row, col}]
const PINCH_PRESS  = 0.06;    // pinch-down threshold
const PINCH_RELEASE = 0.09;   // pinch-up threshold (hysteresis)
const HAND_MATCH_RADIUS = 200;

// ─── Open-pinned curtain state ───
let clothOpenPinned = false;   // curtain locked at top after fling-up
let openPinnedY     = 0;       // Y position of top row when pinned open
let revealPercent   = 0;       // percentage of hidden media exposed

// ─── Debug / UI toggles ───
let showDebug  = false;        // white/red dashed guides
let showHands  = false;        // MediaPipe hand landmark overlay
let handsStatus = 'idle';      // 'idle' | 'loading' | 'ready' | 'error'

// ─── p5.js globals ───
let camCap;

// ═══════════════════════════════════════
//  p5.js setup
// ═══════════════════════════════════════
function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);

  // UI event bindings
  startBtn.addEventListener('click', onStart);
  toggleUiBtn.addEventListener('click', toggleUI);
  uploadBtn.addEventListener('click', () => fileInput.click());
  flipBtn.addEventListener('click', flipCamera);
  zoomSlider.addEventListener('input', () => {
    mediaScale = parseFloat(zoomSlider.value);
  });
  fileInput.addEventListener('change', onFileSelected);

  // Keyboard shortcuts
  window.addEventListener('keydown', (e) => {
    if (e.key === 'h' || e.key === 'H') { showHands = !showHands; }
    if (e.key === 'd' || e.key === 'D') { showDebug = !showDebug; }
  });

  // Default cloth grid
  calcClothRect();
  initClothGrid();
}

// ═══════════════════════════════════════
//  Calculate cloth rectangle dimensions (covers red frame + 3px overflow)
// ═══════════════════════════════════════
function calcClothRect() {
  let aspect;
  if (uploadedMedia) {
    let mw = uploadedMedia.videoWidth  || uploadedMedia.width  || 640;
    let mh = uploadedMedia.videoHeight || uploadedMedia.height || 480;
    aspect = mw / Math.max(mh, 1);
  } else {
    aspect = camAspect;
  }

  const maxW = width  * 0.85;
  const maxH = height * 0.55;
  if (maxW / maxH > aspect) {
    clothH = maxH;
    clothW = clothH * aspect;
  } else {
    clothW = maxW;
    clothH = clothW / aspect;
  }

  // Expand cloth to fully cover the red init-rect + 3px overflow on all sides
  const BLEED = 3;
  clothInitX = (width  - clothW) / 2 - BLEED;
  clothInitY = height * 0.05 - BLEED;
  clothW    += BLEED * 2;
  clothH    += BLEED * 2;

  spacingX = clothW / (COLS - 1);
  spacingY = clothH / (ROWS - 1);
}

// ═══════════════════════════════════════
//  Initialize Verlet grid (no rigid pins — all points free)
// ═══════════════════════════════════════
function initClothGrid() {
  grid = [];
  for (let r = 0; r < ROWS; r++) {
    grid[r] = [];
    for (let c = 0; c < COLS; c++) {
      grid[r][c] = {
        x:  clothInitX + c * spacingX,
        y:  clothInitY + r * spacingY,
        ox: clothInitX + c * spacingX,
        oy: clothInitY + r * spacingY,
        ix: clothInitX + c * spacingX,
        iy: clothInitY + r * spacingY,
        pinned: false,                    // NO rigid pins — soft restoring for top row
        rX: (Math.random() * 40 - 20),    // random offset X: ±20
        rY: (Math.random() * 40 - 35),    // random offset Y: -35~5
      };
    }
  }
  grabbedRow = -1;
  grabbedCol = -1;
  windTime = 0;
  flingMode = null;
  flingTargetY = 0;
  flingRestore = 0;
  lastGrabVY = 0;
  handGrabs = [];
  clothOpenPinned = false;
  openPinnedY = 0;
  revealPercent = 0;
  handsStatus = 'idle';
}

// ═══════════════════════════════════════
//  Verlet integration + constraints + wind + soft-pin + fling + openPinned
// ═══════════════════════════════════════
function updateClothPhysics() {
  // ── 1. Verlet integration ──
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const p = grid[r][c];
      if (p.pinned) continue;

      const vx = (p.x - p.ox) * FRICTION;
      const vy = (p.y - p.oy) * FRICTION;
      p.ox = p.x;
      p.oy = p.y;

      // Perlin wind
      const windX = noise(c * 0.1, r * 0.1, windTime) * 0.25 - 0.12;
      const windY = noise(c * 0.1 + 100, r * 0.1 + 100, windTime) * 0.12;

      p.x += vx + windX;
      p.y += vy + GRAVITY + windY;

      // ── Top row soft restoring (always active) ──
      if (r === 0) {
        p.x += (p.ix - p.x) * TOP_ROW_STIFFNESS_X;
        p.y += (p.iy - p.y) * TOP_ROW_STIFFNESS_Y;
      }

      // ── Open-pinned curtain state: lock all points at top ──
      if (clothOpenPinned) {
        // Strong restoring toward bunched-up position at top
        const targetY = openPinnedY + r * 2.5;  // tight stack: 2.5px per row
        const targetX = p.ix;                    // keep lateral position
        p.x += (targetX - p.x) * 0.18;
        p.y += (targetY - p.y) * 0.18;
        // Add slight compression noise for natural fold look
        p.x += noise(r * 0.5, c * 0.3) * 0.4 - 0.2;
      }

      // ── Fling restore force ──
      if (flingMode === 'up') {
        p.y += (flingTargetY + r * spacingY - p.y) * flingRestore;
      } else if (flingMode === 'down' && !clothOpenPinned) {
        p.y += (p.iy - p.y) * flingRestore;
      }
    }
  }
  windTime += 0.008;

  // ── 2. Apply constraints ──
  for (let iter = 0; iter < CONSTRAINT_ITERS; iter++) {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS - 1; c++) {
        constrainPair(grid[r][c], grid[r][c + 1], spacingX);
      }
    }
    for (let r = 0; r < ROWS - 1; r++) {
      for (let c = 0; c < COLS; c++) {
        constrainPair(grid[r][c], grid[r + 1][c], spacingY);
      }
    }
  }

  // ── 3. Fling completion → open-pinned transition ──
  if (flingMode === 'up') {
    const mid = grid[Math.floor(ROWS/2)][Math.floor(COLS/2)];
    if (Math.abs(mid.y - (flingTargetY + Math.floor(ROWS/2) * spacingY)) < 8) {
      flingMode = null;
      flingRestore = 0;
      // Enter open-pinned mode
      clothOpenPinned = true;
      openPinnedY = grid[0][Math.floor(COLS/2)].y; // top row current Y
    }
  }
}

// ── Constrain one pair of points toward their rest distance ──
function constrainPair(pA, pB, restLen) {
  let dx = pB.x - pA.x;
  let dy = pB.y - pA.y;
  const dist = Math.sqrt(dx * dx + dy * dy) || 0.001;
  const diff = (restLen - dist) / dist;
  const offsetX = dx * diff * 0.5 * STIFFNESS;
  const offsetY = dy * diff * 0.5 * STIFFNESS;
  if (!pA.pinned) { pA.x -= offsetX; pA.y -= offsetY; }
  if (!pB.pinned) { pB.x += offsetX; pB.y += offsetY; }
}

// ═══════════════════════════════════════
//  Build perimeter path from grid
// ═══════════════════════════════════════
function buildClothPath(g) {
  drawingContext.beginPath();
  // Top edge: left → right
  drawingContext.moveTo(g[0][0].x, g[0][0].y);
  for (let c = 1; c < COLS; c++)  drawingContext.lineTo(g[0][c].x, g[0][c].y);
  // Right edge: top → bottom
  for (let r = 1; r < ROWS; r++)  drawingContext.lineTo(g[r][COLS-1].x, g[r][COLS-1].y);
  // Bottom edge: right → left
  for (let c = COLS-2; c >= 0; c--) drawingContext.lineTo(g[ROWS-1][c].x, g[ROWS-1][c].y);
  // Left edge: bottom → top
  for (let r = ROWS-2; r >= 0; r--) drawingContext.lineTo(g[r][0].x, g[r][0].y);
  drawingContext.closePath();
}

// ═══════════════════════════════════════
//  Quad area using Shoelace formula (×2)
// ═══════════════════════════════════════
function quadArea2(p0, p1, p2, p3) {
  return Math.abs(
    p0.x*p1.y + p1.x*p2.y + p2.x*p3.y + p3.x*p0.y -
    p1.x*p0.y - p2.x*p1.y - p3.x*p2.y - p0.x*p3.y
  );
}

// ═══════════════════════════════════════
//  p5.js draw
// ═══════════════════════════════════════
function draw() {
  if (!started) {
    background(20);
    return;
  }

  // ── Apply hand grabs (sync, before physics) ──
  if (handsActive && handTrack.length > 0) {
    applyHandGrabs();
  }

  // ── Update physics ──
  updateClothPhysics();

  // ── Cache cloth perimeter path once per frame ──
  // (used by Layer 3 clip + texture + debug outline)
  const ctx2d = drawingContext;

  // ═══════════════════════════════════════
  //  THREE-LAYER OPTICAL CAMOUFLAGE
  // ═══════════════════════════════════════

  // ─── Layer 1: Bottom — full-screen live camera ───
  if (camReady && camCap) {
    image(camCap, 0, 0, width, height);
  } else {
    background(20); noStroke(); fill(80);
    textAlign(CENTER, CENTER); textSize(15);
    text('等待摄像头...', width/2, height/2);
  }

  // ─── Layer 2: Middle — uploaded media at cloth INITIAL position ───
  if (uploadedMedia && camReady) {
    push();
    ctx2d.beginPath(); ctx2d.rect(clothInitX, clothInitY, clothW, clothH); ctx2d.clip();
    drawMediaInRect(clothInitX, clothInitY, clothW, clothH);
    pop();
  }

  // ─── Layer 3: Top — live camera clipped to CURRENT cloth polygon ───
  if (camReady && camCap) {
    push();
    buildClothPath(grid); ctx2d.clip();
    image(camCap, 0, 0, width, height);
    pop();
  }

  // ─── Cloth texture (skip if cloth is nearly flat — performance) ───
  if (camReady) {
    renderClothTexture();
  }

  // ─── Debug guides (toggle with 'D' key) ───
  if (showDebug) {
    push();
    ctx2d.setLineDash([8, 4]);
    noFill(); strokeWeight(1.3);
    stroke(255, 255, 255, 100);
    buildClothPath(grid); ctx2d.stroke();
    stroke(255, 80, 80, 120);
    ctx2d.beginPath(); ctx2d.rect(clothInitX, clothInitY, clothW, clothH); ctx2d.stroke();
    ctx2d.setLineDash([]);
    pop();
  }

  // ── Send frame to MediaPipe Hands (throttled) ──
  processHandsFrame();

  // ─── Hand landmarks overlay (toggle with 'H' key) ───
  if (showHands && handsActive && handTrack.length > 0) {
    push();
    noFill();
    for (const h of handTrack) {
      strokeWeight(h.pinching ? 4 : 1.5);
      stroke(h.pinching ? 'rgba(0,255,100,0.9)' : 'rgba(255,255,255,0.4)');
      ctx2d.beginPath(); ctx2d.arc(h.x, h.y, 12, 0, Math.PI * 2); ctx2d.stroke();
      fill(255, 255, 255, 200); noStroke();
      textAlign(CENTER, CENTER); textSize(10);
      text(`${h.pinchDist.toFixed(3)}`, h.x, h.y - 20);
      text(`H#${String(h.id).slice(-3)} ${h.pinching ? 'PINCH' : ''}`, h.x, h.y + 18);
    }
    pop();
  }

  // ─── Calculate reveal percentage ───
  {
    let totalDisp = 0, maxDisp = 0;
    const midR = Math.floor(ROWS/2);
    for (let c = 0; c < COLS; c++) {
      const dy = grid[midR][c].y - grid[midR][c].iy;
      totalDisp += dy;
      maxDisp += clothH * 0.7; // 70% of cloth height = 100% reveal per point
    }
    revealPercent = Math.round(constrain(totalDisp / Math.max(maxDisp, 1) * 100, 0, 100));
  }

  // ─── Reveal percentage display (top-left, prominent) ───
  if (camReady) {
    push();
    textAlign(LEFT, CENTER);
    textSize(15);
    fill(255, 255, 255, 180);
    noStroke();
    text(`Reveal: ${revealPercent}%`, 14, height - 22);
    // Mini progress bar
    const barW = 100, barH = 3, barX = 14, barY = height - 10;
    noStroke();
    fill(255, 255, 255, 50);
    ctx2d.beginPath(); ctx2d.roundRect(barX, barY, barW, barH, 2); ctx2d.fill();
    fill(255, 255, 255, 200);
    ctx2d.beginPath(); ctx2d.roundRect(barX, barY, barW * revealPercent/100, barH, 2); ctx2d.fill();
    pop();
  }

  // ─── Status text (top-left compact) ───
  push();
  fill(255, 255, 255, 100); noStroke();
  textAlign(LEFT, TOP); textSize(10);
  const pinStr = clothOpenPinned ? '🔒' : '';
  const flingStr = flingMode ? ` ⚡${flingMode}` : '';
  const hCount = handsActive ? handTrack.length : 0;
  const hStr = handsActive ? (handsBusy ? '▮' : '▯') + hCount : '';
  const hLabel = handsStatus === 'loading' ? '…' : handsStatus === 'error' ? '✗' : hStr;
  text(`[H/D] ${pinStr}${flingStr} 👋${hLabel} ${revealPercent}%`, 12, 12);
  pop();

  // ─── Show/hide placeholder hint ───
  if (!uploadedMedia) {
    placeholder.classList.remove('hidden');
  } else {
    placeholder.classList.add('hidden');
  }
}

// ═══════════════════════════════════════
//  Cloth texture: quad shading + dual edge stroke
// ═══════════════════════════════════════
function renderClothTexture() {
  const ctx = drawingContext;

  // ── Quad-based shading ──
  // Compare current area vs original (flat) area.
  // Compressed quads (area < orig) → black shadow (max alpha 120)
  // Stretched quads (area > orig) → white highlight (max alpha 60)
  const origArea = spacingX * spacingY * 2; // quad area ×2 (shoelace of flat rect)

  for (let r = 0; r < ROWS - 1; r++) {
    for (let c = 0; c < COLS - 1; c++) {
      const p0 = grid[r][c];
      const p1 = grid[r][c+1];
      const p2 = grid[r+1][c+1];
      const p3 = grid[r+1][c];
      const curArea = quadArea2(p0, p1, p2, p3);

      if (Math.abs(curArea - origArea) < 1) continue; // skip if flat

      const ratio = curArea / origArea;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.closePath();

      if (ratio < 1) {
        // Compressed → shadow (black, alpha max 120)
        const a = constrain(map(1 - ratio, 0, 0.5, 0, 120), 0, 120);
        ctx.fillStyle = `rgba(0,0,0,${a/255})`;
      } else {
        // Stretched → highlight (white, alpha max 60)
        const a = constrain(map(ratio - 1, 0, 0.4, 0, 60), 0, 60);
        ctx.fillStyle = `rgba(255,255,255,${a/255})`;
      }
      ctx.fill();
    }
  }

  // ── Dual edge stroke (lighter, transparent liquid-glow) ──
  // Inner: black alpha 8, strokeWeight 4
  // Outer: white alpha 28 + shadowBlur 12 (subtle glow, preserves transparency)
  ctx.save();
  buildClothPath(grid);

  // Outer subtle glow
  ctx.shadowColor = 'rgba(255,255,255,0.35)';
  ctx.shadowBlur = 12;
  ctx.strokeStyle = 'rgba(255,255,255,0.11)';  // alpha ~28
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Inner whisper-dark
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(0,0,0,0.03)';        // alpha ~8
  ctx.lineWidth = 4;
  ctx.stroke();

  ctx.restore();
}

// ═══════════════════════════════════════
//  Clip helper
// ═══════════════════════════════════════
function clipRect(x, y, w, h) {
  drawingContext.beginPath();
  drawingContext.rect(x, y, w, h);
  drawingContext.clip();
}

// ═══════════════════════════════════════
//  Draw uploaded media fitted into a rect
// ═══════════════════════════════════════
function drawMediaInRect(rx, ry, rw, rh) {
  if (!uploadedMedia) return;

  const mw = uploadedMedia.videoWidth  || uploadedMedia.naturalWidth  || uploadedMedia.width  || 640;
  const mh = uploadedMedia.videoHeight || uploadedMedia.naturalHeight || uploadedMedia.height || 480;
  const mRatio = mw / Math.max(mh, 1);
  const rRatio = rw / rh;

  let dw, dh, dx, dy;
  if (mRatio > rRatio) {
    dw = rw * mediaScale;
    dh = dw / mRatio;
    dx = rx + (rw - dw) / 2;
    dy = ry + (rh - dh) / 2;
  } else {
    dh = rh * mediaScale;
    dw = dh * mRatio;
    dy = ry + (rh - dh) / 2;
    dx = rx + (rw - dw) / 2;
  }

  drawingContext.drawImage(uploadedMedia, dx, dy, dw, dh);
}

// ═══════════════════════════════════════
//  Mouse interaction — grab nearest grid point
// ═══════════════════════════════════════
function mousePressed() {
  if (!started) return;
  // ── Any mouse click while open-pinned → immediate unlock with downward impulse ──
  if (clothOpenPinned) {
    clothOpenPinned = false;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        grid[r][c].oy = grid[r][c].y - 45;
      }
    }
  }
  tryGrabPoint(mouseX, mouseY);
  prevMouseX = mouseX; prevMouseY = mouseY;
  mouseVelX = 0; mouseVelY = 0;
  lastGrabVY = 0;
}

function mouseDragged() {
  if (!started || grabbedRow < 0) return;
  const p = grid[grabbedRow][grabbedCol];
  p.ox = p.x; p.oy = p.y;
  p.x = mouseX; p.y = mouseY;
  // Track velocity
  mouseVelX = mouseX - prevMouseX;
  mouseVelY = mouseY - prevMouseY;
  prevMouseX = mouseX; prevMouseY = mouseY;
}

function mouseReleased() {
  if (!started) return;
  if (grabbedRow >= 0) {
    lastGrabVY = mouseVelY;
    applyFlingOnRelease();
  }
  grabbedRow = -1; grabbedCol = -1;
}

// ═══════════════════════════════════════
//  Touch interaction — grab nearest grid point
// ═══════════════════════════════════════
function touchStarted() {
  if (!started) return;
  // ── Any touch while open-pinned → immediate unlock ──
  if (clothOpenPinned) {
    clothOpenPinned = false;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        grid[r][c].oy = grid[r][c].y - 45;
      }
    }
  }
  if (touches.length === 1) {
    tryGrabPoint(touches[0].x, touches[0].y);
    prevMouseX = touches[0].x; prevMouseY = touches[0].y;
    mouseVelX = 0; mouseVelY = 0; lastGrabVY = 0;
  }
  return false;
}

function touchMoved() {
  if (!started || grabbedRow < 0 || touches.length !== 1) return;
  const t = touches[0];
  const p = grid[grabbedRow][grabbedCol];
  p.ox = p.x; p.oy = p.y;
  p.x = t.x; p.y = t.y;
  // Track velocity
  mouseVelX = t.x - prevMouseX;
  mouseVelY = t.y - prevMouseY;
  prevMouseX = t.x; prevMouseY = t.y;
  return false;
}

function touchEnded() {
  if (!started) return;
  if (grabbedRow >= 0) {
    lastGrabVY = mouseVelY;
    applyFlingOnRelease();
  }
  grabbedRow = -1; grabbedCol = -1;
  return false;
}

// ── Fling detection: check release velocity ──
function applyFlingOnRelease() {
  // If cloth is open-pinned, dragging down unpins it (no fling needed)
  if (clothOpenPinned) {
    clothOpenPinned = false;
    flingMode = 'down';
    flingRestore = 0.0011;
    return;
  }

  if (lastGrabVY < -15) {
    // Fling UP → snap to top, then lock open
    flingMode = 'up';
    flingTargetY = 85 + (Math.random() * 30 - 15);
    flingRestore = 0.02;
  } else if (lastGrabVY > 15) {
    // Fling DOWN → slow sag back
    flingMode = 'down';
    flingRestore = 0.0011;
  } else {
    flingMode = null;
    flingRestore = 0;
  }
}

// ── Find nearest grid point within GRAB_RADIUS (any row, including top) ──
function tryGrabPoint(gx, gy) {
  let bestDist = GRAB_RADIUS;
  let bestR = -1, bestC = -1;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      // No pinned check — all points are grabbable, including top row
      const dx = grid[r][c].x - gx;
      const dy = grid[r][c].y - gy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < bestDist) { bestDist = dist; bestR = r; bestC = c; }
    }
  }
  if (bestR >= 0) { grabbedRow = bestR; grabbedCol = bestC; }
}

// ═══════════════════════════════════════
//  MediaPipe Hands initialization
// ═══════════════════════════════════════
async function initHands() {
  if (typeof Hands === 'undefined') {
    handsStatus = 'error';
    handsActive = false;
    return;
  }
  handsStatus = 'loading';
  try {
    hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.5,
    });
    hands.onResults(onHandsResults);
    // Wait briefly for WASM to initialize, then mark ready
    await new Promise(r => setTimeout(r, 800));
    handsLoaded = true;
    handsActive = true;
    handsStatus = 'ready';
  } catch (err) {
    handsStatus = 'error';
    handsActive = false;
  }
}

// ── Process hand results (async callback — stores data only, NO grid mutation) ──
function onHandsResults(results) {
  latestResults = results;
  if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
    handTrack = [];
    return;
  }

  const newTracks = [];

  for (let i = 0; i < results.multiHandLandmarks.length; i++) {
    const lm = results.multiHandLandmarks[i];

    // Pinch detection (thumb=4, index=8)
    const thumb = lm[4], index = lm[8];
    const pinchDist = Math.hypot(thumb.x - index.x, thumb.y - index.y);

    // Pinch midpoint → canvas coords (direct mapping, camera is non-mirrored)
    const canvasX = ((thumb.x + index.x) / 2) * width;
    const canvasY = ((thumb.y + index.y) / 2) * height;

    // Match previous hand (frame-to-frame, 200px radius)
    let matchedId = -1;
    let bestDist = HAND_MATCH_RADIUS;
    for (const prev of handTrack) {
      const d = Math.hypot(prev.x - canvasX, prev.y - canvasY);
      if (d < bestDist) { bestDist = d; matchedId = prev.id; }
    }

    // Hysteresis pinch state
    const prevH = handTrack.find(h => h.id === matchedId);
    let pinching;
    if (prevH) {
      pinching = prevH.pinching ? (pinchDist < PINCH_RELEASE) : (pinchDist < PINCH_PRESS);
    } else {
      pinching = pinchDist < PINCH_PRESS;
    }

    // Velocity (for fling detection on release)
    const vx = prevH ? canvasX - prevH.x : 0;
    const vy = prevH ? canvasY - prevH.y : 0;

    newTracks.push({
      id: (matchedId >= 0) ? matchedId : Date.now() + i,
      x: canvasX, y: canvasY,
      vx, vy,
      pinchDist, pinching,
    });
  }

  handTrack = newTracks;

  // ── Update handGrabs: only store intent, don't modify grid ──
  const activeIds = new Set();
  for (const h of handTrack) {
    if (h.pinching) {
      activeIds.add(h.id);
      const existing = handGrabs.find(g => g.handId === h.id);
      if (!existing) {
        // New grab: find nearest point (store intent, apply later in draw)
        const pt = findNearestPoint(h.x, h.y);
        if (pt) {
          handGrabs.push({ handId: h.id, row: pt.row, col: pt.col });
        }
      }
      // If existing, position update happens in applyHandGrabs()
    }
  }
  // Remove grabs for hands no longer pinching
  handGrabs = handGrabs.filter(g => {
    if (!activeIds.has(g.handId)) {
      // Detect fling on release (hand)
      const h = handTrack.find(t => t.id === g.handId);
      if (clothOpenPinned) {
        // Was pinned — release after grab unpins it (no fling here, unpin is handled by grab)
        return false;
      }
      if (h && h.vy < -15) {
        flingMode = 'up';
        flingTargetY = 85 + (Math.random() * 30 - 15);
        flingRestore = 0.02;
      } else if (h && h.vy > 15) {
        flingMode = 'down';
        flingRestore = 0.0011;
      }
      return false;
    }
    return true;
  });
}

// ── Find nearest cloth point (no pinned restrictions) ──
function findNearestPoint(gx, gy) {
  let bestR = -1, bestC = -1;
  let bestDist2 = GRAB_RADIUS * GRAB_RADIUS; // squared compare (faster)
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const dx = grid[r][c].x - gx, dy = grid[r][c].y - gy;
      const d2 = dx * dx + dy * dy;
      if (d2 < bestDist2) { bestDist2 = d2; bestR = r; bestC = c; }
    }
  }
  return (bestR >= 0) ? { row: bestR, col: bestC } : null;
}

// ── Apply hand grabs (synchronous, before physics) ──
// Immediate follow (0.85 lerp), locked grab, neighbor pull, unpins on any grab
function applyHandGrabs() {
  for (const h of handTrack) {
    if (!h.pinching) continue;
    const grab = handGrabs.find(g => g.handId === h.id);
    if (grab && grab.row >= 0 && grab.col >= 0) {
      // ── ANY successful grab while open-pinned → immediate unlock ──
      if (clothOpenPinned) {
        clothOpenPinned = false;
        // Strong downward impulse to ALL points so cloth visibly drops
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            grid[r][c].oy = grid[r][c].y - 45; // push old-Y downward
          }
        }
      }

      const p = grid[grab.row][grab.col];

      // ── Immediate snap to hand (0.85 lerp = near-instant) ──
      p.x += (h.x - p.x) * 0.85;
      p.y += (h.y - p.y) * 0.85;
      p.ox = p.x;
      p.oy = p.y;

      // ── Neighbor pull (60px radius, smooth deformation) ──
      const r0 = Math.max(0, grab.row - 2), r1 = Math.min(ROWS - 1, grab.row + 2);
      const c0 = Math.max(0, grab.col - 2), c1 = Math.min(COLS - 1, grab.col + 2);
      for (let r = r0; r <= r1; r++) {
        for (let c = c0; c <= c1; c++) {
          if (r === grab.row && c === grab.col) continue;
          const np = grid[r][c];
          const dx = np.x - p.x, dy = np.y - p.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
          if (dist < 60) {
            const influence = (1 - dist / 60) * 0.4;
            np.x += (p.x - np.x) * influence;
            np.y += (p.y - np.y) * influence;
            np.ox = np.x; np.oy = np.y;
          }
        }
      }
    }
  }
}

// ── Send camera frame to MediaPipe (throttled, ~15fps, with busy lock) ──
function processHandsFrame() {
  if (!handsActive || !handsLoaded || !camReady || !camCap) return;
  if (handsBusy) return; // mutex: skip if previous frame still processing
  handsSkip++;
  if (handsSkip < HANDS_FPS) return;
  handsSkip = 0;
  const el = camCap.elt;
  if (!el || el.readyState < 2) return;
  handsBusy = true;
  hands.send({ image: el })
    .then(() => { handsBusy = false; })
    .catch(() => { handsBusy = false; });
}

// ═══════════════════════════════════════
//  Start flow
// ═══════════════════════════════════════
async function onStart() {
  startOverlay.classList.add('hidden');
  started = true;
  await startCamera();
  // Init MediaPipe after camera is ready (non-blocking)
  initHands();
}

// ═══════════════════════════════════════
//  Camera
// ═══════════════════════════════════════
async function startCamera() {
  try {
    camCap = createCapture({
      video: { facingMode: facingMode, width:{ideal:1280}, height:{ideal:720} },
      audio: false,
    });
    camCap.hide();

    await new Promise((resolve, reject) => {
      const el = camCap.elt;
      if (!el) return reject(new Error('no video element'));
      if (el.readyState >= 2) return resolve();
      el.addEventListener('loadedmetadata', resolve, { once: true });
      setTimeout(() => reject(new Error('camera metadata timeout')), 5000);
    });

    camAspect = camCap.width / Math.max(camCap.height, 1);
    camReady = true;
    calcClothRect();
    initClothGrid();
  } catch (err) {
    console.error('Camera error:', err);
    camReady = false;
    calcClothRect();
    initClothGrid();
  }
}

async function flipCamera() {
  facingMode = (facingMode === 'user') ? 'environment' : 'user';
  if (camCap) { camCap.remove(); camCap = null; }
  // Reset MediaPipe for new camera stream
  if (hands) { hands.close(); hands = null; }
  handsLoaded = false;
  handsActive = false;
  latestResults = null;
  handTrack = [];
  handGrabs = [];
  camReady = false;
  await startCamera();
  initHands(); // re-init with new camera
}

// ═══════════════════════════════════════
//  File upload
// ═══════════════════════════════════════
function onFileSelected(e) {
  const file = e.target.files[0];
  if (!file) return;

  const url  = URL.createObjectURL(file);
  const isVid = file.type.startsWith('video/');

  if (isVid) {
    mediaVideo.src = url;
    mediaVideo.loop = true;
    mediaVideo.playsInline = true;
    // Play immediately while still in user-gesture context (required for audio)
    mediaVideo.play().catch(() => {});
    mediaVideo.onloadedmetadata = () => {
      uploadedMedia = mediaVideo;
      mediaType = 'video';
      // Ensure playback continues after metadata loads
      if (mediaVideo.paused) mediaVideo.play().catch(() => {});
      calcClothRect();
      initClothGrid();
    };
  } else {
    mediaImg.onload = () => {
      uploadedMedia = mediaImg;
      mediaType = 'image';
      calcClothRect();
      initClothGrid();
    };
    mediaImg.src = url;
  }

  fileInput.value = '';
}

// ═══════════════════════════════════════
//  UI toggle
// ═══════════════════════════════════════
function toggleUI() {
  uiVisible = !uiVisible;
  if (uiVisible) {
    uiLayer.classList.remove('ui-hidden');
    toggleUiBtn.textContent = '👁';
  } else {
    uiLayer.classList.add('ui-hidden');
    toggleUiBtn.textContent = '👁';
  }
}

// ═══════════════════════════════════════
//  windowResized
// ═══════════════════════════════════════
function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  calcClothRect();
  initClothGrid();
}
