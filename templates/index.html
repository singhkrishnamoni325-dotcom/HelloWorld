<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 炫酷仪表盘 | Flask + JS</title>
    <style>
        /* ========== Reset & Base ========== */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --neon-cyan: #00f0ff;
            --neon-pink: #ff00e5;
            --neon-green: #39ff14;
            --neon-yellow: #ffe600;
            --bg-dark: #0a0a0f;
            --glass-bg: rgba(15, 15, 30, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text: #e0e0e0;
            --text-dim: #888;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            cursor: default;
            user-select: none;
        }

        /* ========== Canvas 粒子背景 ========== */
        #particle-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ========== 主容器 ========== */
        .main-container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 30px;
        }

        /* ========== 头部 ========== */
        .header {
            text-align: center;
            padding: 40px 0 20px;
        }
        .header h1 {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink), var(--neon-cyan));
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.4));
        }
        .header .subtitle {
            font-size: 1rem;
            color: var(--text-dim);
            letter-spacing: 8px;
            margin-top: 8px;
            animation: fadeInUp 0.8s ease-out;
        }

        /* 实时时钟 */
        .live-clock {
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 3px;
            color: var(--neon-cyan);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            margin-top: 12px;
            font-variant-numeric: tabular-nums;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
        }

        /* ========== Glass Card 通用 ========== */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
            transition: left 0.6s;
        }
        .glass-card:hover::before { left: 100%; }
        .glass-card:hover {
            transform: translateY(-6px);
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.5),
                0 0 30px rgba(0, 240, 255, 0.1),
                inset 0 1px 0 rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.18);
        }

        /* ========== 统计卡片网格 ========== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .stat-card {
            text-align: center;
            padding: 28px 16px;
        }
        .stat-card .icon {
            font-size: 2.2rem;
            margin-bottom: 10px;
            display: block;
            animation: float 3s ease-in-out infinite;
        }
        .stat-card:nth-child(odd) .icon { animation-delay: 0s; }
        .stat-card:nth-child(even) .icon { animation-delay: 1.5s; }
        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: all 0.3s;
        }
        .stat-card .label {
            font-size: 0.85rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            margin-top: 6px;
            text-transform: uppercase;
        }

        /* ========== 双栏布局 ========== */
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin: 24px 0;
        }
        @media (max-width: 768px) {
            .two-col { grid-template-columns: 1fr; }
            .header h1 { font-size: 2rem; }
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 3px;
            margin-bottom: 16px;
            color: var(--neon-pink);
            text-shadow: 0 0 10px rgba(255, 0, 229, 0.4);
        }

        /* ========== 留言板 ========== */
        .message-list {
            max-height: 280px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
        }
        .message-list::-webkit-scrollbar { width: 4px; }
        .message-list::-webkit-scrollbar-track { background: transparent; }
        .message-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
        }
        .msg-item {
            background: rgba(255,255,255,0.03);
            border-left: 3px solid var(--neon-cyan);
            border-radius: 6px 12px 12px 6px;
            padding: 10px 14px;
            animation: slideIn 0.4s ease-out;
            transition: all 0.3s;
        }
        .msg-item:hover {
            background: rgba(0,240,255,0.06);
            border-left-color: var(--neon-pink);
        }
        .msg-author {
            font-size: 0.8rem;
            color: var(--neon-cyan);
            font-weight: 600;
            letter-spacing: 1px;
        }
        .msg-text {
            margin-top: 4px;
            font-size: 0.95rem;
        }
        .msg-time {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-top: 4px;
        }

        /* 输入区 */
        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .input-group input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
        }
        .input-group input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0,240,255,0.15);
            background: rgba(255,255,255,0.08);
        }
        .input-group input::placeholder { color: rgba(255,255,255,0.25); }

        /* ========== 按钮 ========== */
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            font-family: inherit;
        }
        .btn-glow {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            color: #fff;
            box-shadow: 0 0 25px rgba(0,240,255,0.3);
        }
        .btn-glow:hover {
            box-shadow: 0 0 45px rgba(0,240,255,0.5);
            transform: translateY(-2px);
        }
        .btn-glow:active { transform: scale(0.96); }
        .btn-sm {
            padding: 8px 18px;
            font-size: 0.8rem;
            border-radius: 8px;
        }

        /* Ripple */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.35);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }

        /* ========== 随机卡片区 ========== */
        .random-card {
            text-align: center;
            padding: 32px;
        }
        .random-quote {
            font-size: 1.2rem;
            font-style: italic;
            color: var(--neon-yellow);
            text-shadow: 0 0 15px rgba(255,230,0,0.3);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s;
        }
        .color-badge {
            display: inline-block;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin: 16px;
            transition: all 0.5s;
            box-shadow: 0 0 30px currentColor;
        }

        /* ========== 进度条 ========== */
        .progress-group { margin-top: 16px; }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-bottom: 6px;
            color: var(--text-dim);
        }
        .progress-bar {
            height: 6px;
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .progress-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green));
            box-shadow: 0 0 10px rgba(0,240,255,0.4);
        }

        /* ========== 动画关键帧 ========== */
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 999;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--neon-green);
            border-radius: 12px;
            padding: 14px 24px;
            color: var(--neon-green);
            font-weight: 600;
            letter-spacing: 1px;
            animation: slideIn 0.4s ease-out, fadeOut 0.4s 2.6s ease-out forwards;
            box-shadow: 0 0 30px rgba(57,255,20,0.2);
        }
        @keyframes fadeOut {
            to { opacity: 0; transform: translateX(40px); }
        }
    </style>
</head>
<body>

    <!-- 粒子背景 -->
    <canvas id="particle-canvas"></canvas>

    <!-- Toast 容器 -->
    <div id="toast-container"></div>

    <!-- 主容器 -->
    <div class="main-container">

        <!-- ===== 头部 ===== -->
        <header class="header">
            <h1>◈ N E X U S ◈</h1>
            <p class="subtitle">F L A S K  ×  J A V A S C R I P T</p>
            <div class="live-clock" id="live-clock">--</div>
        </header>

        <!-- ===== 统计卡片 ===== -->
        <div class="stats-grid" id="stats-grid">
            <div class="glass-card stat-card">
                <span class="icon">👥</span>
                <div class="value" id="stat-visitors">--</div>
                <div class="label">Visitors</div>
            </div>
            <div class="glass-card stat-card">
                <span class="icon">⚡</span>
                <div class="value" id="stat-requests">--</div>
                <div class="label">Requests</div>
            </div>
            <div class="glass-card stat-card">
                <span class="icon">⏱️</span>
                <div class="value" id="stat-uptime">--</div>
                <div class="label">Uptime</div>
            </div>
            <div class="glass-card stat-card">
                <span class="icon">🔥</span>
                <div class="value" id="stat-cpu">--%</div>
                <div class="label">CPU</div>
            </div>
        </div>

        <!-- ===== 双栏 ===== -->
        <div class="two-col">

            <!-- 留言板 -->
            <div class="glass-card">
                <div class="section-title">💬 留言板</div>
                <div class="message-list" id="message-list">
                    <div style="color:var(--text-dim);text-align:center;padding:40px;">加载中...</div>
                </div>
                <div class="input-group">
                    <input type="text" id="input-author" placeholder="你的名字" maxlength="20" style="max-width:120px;">
                    <input type="text" id="input-text" placeholder="说点什么吧..." maxlength="100">
                    <button class="btn btn-glow" id="btn-send">发送</button>
                </div>
            </div>

            <!-- 随机 & 系统状态 -->
            <div class="glass-card random-card">
                <div class="section-title">🎲 随机灵感</div>
                <div class="color-badge" id="color-badge" style="background:hsl(200,80%,60%);"></div>
                <div class="random-quote" id="random-quote">点击按钮获取灵感 ✨</div>
                <button class="btn btn-glow btn-sm" id="btn-random" style="margin-top:12px;">🎯 来点灵感</button>

                <div class="progress-group" style="margin-top:24px;">
                    <div class="progress-label"><span>CPU</span><span id="prog-cpu">--%</span></div>
                    <div class="progress-bar"><div class="progress-fill" id="fill-cpu" style="width:0%"></div></div>
                    <div class="progress-label"><span>Memory</span><span id="prog-mem">--%</span></div>
                    <div class="progress-bar"><div class="progress-fill" id="fill-mem" style="width:0%;background:linear-gradient(90deg,var(--neon-pink),var(--neon-yellow));"></div></div>
                    <div class="progress-label"><span>Disk</span><span id="prog-disk">--%</span></div>
                    <div class="progress-bar"><div class="progress-fill" id="fill-disk" style="width:0%;background:linear-gradient(90deg,var(--neon-yellow),var(--neon-green));"></div></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== 粒子网络背景 ====================
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const PARTICLE_COUNT = 80;
        const CONNECT_DIST = 140;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', () => {
            resizeCanvas();
            initParticles();
        });

        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height; // 初始随机分布
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -10;
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = Math.random() * 0.4 + 0.1;
                this.radius = Math.random() * 1.8 + 0.5;
                this.opacity = Math.random() * 0.6 + 0.2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.y > canvas.height + 10 || this.x < -10 || this.x > canvas.width + 10) {
                    this.reset();
                    this.y = -10;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 240, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = Array.from({ length: PARTICLE_COUNT }, () => new Particle());
        }
        initParticles();

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => { p.update(); p.draw(); });

            // 连线
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < CONNECT_DIST) {
                        const alpha = (1 - dist / CONNECT_DIST) * 0.25;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(0, 240, 255, ${alpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }

            // 鼠标交互 — 吸引粒子
            if (mouse.x && mouse.y) {
                particles.forEach(p => {
                    const dx = mouse.x - p.x;
                    const dy = mouse.y - p.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 150) {
                        p.x += dx * 0.003;
                        p.y += dy * 0.003;
                    }
                });
            }

            requestAnimationFrame(animateParticles);
        }

        const mouse = { x: null, y: null };
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });

        // 触摸支持
        window.addEventListener('touchmove', e => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }, { passive: true });
        window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });

        animateParticles();

        // ==================== 实时时钟 ====================
        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').textContent =
                now.toLocaleString('zh-CN', {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit', second: '2-digit',
                    hour12: false
                });
            requestAnimationFrame(() => setTimeout(updateClock, 1000 - now.getMilliseconds()));
        }
        updateClock();

        // ==================== API 调用 ====================
        const API = {
            stats: () => fetch('/api/stats').then(r => r.json()),
            messages: () => fetch('/api/messages').then(r => r.json()),
            sendMessage: (author, text) =>
                fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ author, text })
                }).then(r => r.json()),
            random: () => fetch('/api/random').then(r => r.json()),
        };

        // ==================== 刷新统计 ====================
        async function refreshStats() {
            try {
                const data = await API.stats();
                // 数字滚动动画
                animateValue('stat-visitors', data.visitors);
                animateValue('stat-requests', data.requests);
                document.getElementById('stat-uptime').textContent = data.uptime;
                document.getElementById('stat-cpu').textContent = data.cpu + '%';

                // 进度条
                document.getElementById('prog-cpu').textContent = data.cpu + '%';
                document.getElementById('prog-mem').textContent = data.memory + '%';
                document.getElementById('prog-disk').textContent = data.disk + '%';
                document.getElementById('fill-cpu').style.width = data.cpu + '%';
                document.getElementById('fill-mem').style.width = data.memory + '%';
                document.getElementById('fill-disk').style.width = data.disk + '%';
            } catch (e) { console.error('Stats fetch error:', e); }
        }

        function animateValue(id, target) {
            const el = document.getElementById(id);
            const current = parseInt(el.textContent) || 0;
            const diff = target - current;
            const steps = 20;
            const duration = 400;
            let step = 0;

            function tick() {
                step++;
                const progress = step / steps;
                // easeOutCubic
                const eased = 1 - Math.pow(1 - progress, 3);
                el.textContent = Math.round(current + diff * eased);
                if (step < steps) requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        }

        // ==================== 加载留言 ====================
        async function loadMessages() {
            try {
                const msgs = await API.messages();
                const container = document.getElementById('message-list');
                container.innerHTML = msgs.map(m => `
                    <div class="msg-item">
                        <div class="msg-author">${escapeHtml(m.author)}</div>
                        <div class="msg-text">${escapeHtml(m.text)}</div>
                        <div class="msg-time">${m.time}</div>
                    </div>
                `).join('');
                container.scrollTop = container.scrollHeight;
            } catch (e) { console.error('Messages fetch error:', e); }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ==================== 发送留言 ====================
        async function sendMessage() {
            const authorInput = document.getElementById('input-author');
            const textInput = document.getElementById('input-text');
            const author = authorInput.value.trim() || 'Anonymous';
            const text = textInput.value.trim();
            if (!text) return;

            try {
                await API.sendMessage(author, text);
                textInput.value = '';
                showToast('✅ 消息发送成功！');
                await loadMessages();
            } catch (e) {
                showToast('❌ 发送失败，请重试');
            }
        }

        document.getElementById('btn-send').addEventListener('click', sendMessage);
        document.getElementById('input-text').addEventListener('keydown', e => {
            if (e.key === 'Enter') sendMessage();
        });

        // ==================== 随机灵感 ====================
        async function fetchRandom() {
            try {
                const data = await API.random();
                const badge = document.getElementById('color-badge');
                badge.style.background = data.color;
                badge.style.boxShadow = `0 0 35px ${data.color}`;
                document.getElementById('random-quote').textContent = `"${data.quote}"`;
                document.getElementById('random-quote').style.color = data.color;
            } catch (e) { console.error('Random fetch error:', e); }
        }

        document.getElementById('btn-random').addEventListener('click', fetchRandom);

        // ==================== Ripple 特效 ====================
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('.btn');
            if (!btn) return;
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            const rect = btn.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            btn.appendChild(ripple);
            ripple.addEventListener('animationend', () => ripple.remove());
        });

        // ==================== Toast ====================
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ==================== 初始化 ====================
        refreshStats();
        loadMessages();
        fetchRandom();

        // 每5秒刷新统计
        setInterval(refreshStats, 5000);
        // 每10秒刷新留言
        setInterval(loadMessages, 10000);

        console.log('%c🚀 Nexus Dashboard Ready %c| %cFlask + Vanilla JS %c✨',
            'color:#00f0ff;font-size:18px;',
            '',
            'color:#ff00e5;',
            '');
    </script>
</body>
